name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B out -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build out --config Release --parallel
      - name: Package
        run: cmake --install out --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        with:
          name: Zenith-Dot-Windows-x64
          path: dist/
          if-no-files-found: error
